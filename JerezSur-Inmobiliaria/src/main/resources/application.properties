spring.config.import=optional:file:.env[.properties]

# --- CONFIGURACIÓN DE LA BASE DE DATOS ---
spring.datasource.url=jdbc:mysql://localhost:3306/jerezsur_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=toor
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- CONFIGURACIÓN DE JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Importante para que Hibernate no intente crear tablas que ya existen o de forma errónea
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- CONFIGURACIÓN DE SEGURIDAD OAUTH2 ---
