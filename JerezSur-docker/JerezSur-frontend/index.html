<!doctype html>
<html lang="es" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── Metadatos base ─────────────────────────────────────────────── -->
  <title>JerezSur Inmobiliaria — Compra, vende o alquila en Jerez</title>
  <meta name="description" content="Inmobiliaria en Jerez de la Frontera. Compra, vende o alquila tu vivienda con expertos locales. Pisos, casas, chalets y locales." />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="JerezSur Inmobiliaria" />
  <meta name="theme-color" content="#00439c" />
  <!-- Mejora Best Practices: indica al navegador que la web solo usa modo claro -->
  <meta name="color-scheme" content="light" />
  <!-- Evita que el navegador infiera el MIME type (seguridad) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />

  <!-- ── Favicon ───────────────────────────────────────────────────── -->
  <link rel="icon" type="image/png" sizes="32x32" href="/Favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/Favicon.png" />

  <!-- ── Open Graph (Facebook, WhatsApp, LinkedIn) ─────────────────── -->
  <meta property="og:type"        content="website" />
  <meta property="og:site_name"   content="JerezSur Inmobiliaria" />
  <meta property="og:title"       content="JerezSur Inmobiliaria — Compra, vende o alquila en Jerez" />
  <meta property="og:description" content="Inmobiliaria de confianza en Jerez de la Frontera. Pisos, casas, chalets y locales en venta y alquiler." />
  <meta property="og:image"       content="/Hero.jpg" />
  <meta property="og:image:width"  content="1280" />
  <meta property="og:image:height" content="720" />
  <meta property="og:image:alt"   content="Inmuebles en Jerez de la Frontera — JerezSur Inmobiliaria" />
  <meta property="og:locale"      content="es_ES" />

  <!-- ── Twitter Card ──────────────────────────────────────────────── -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="JerezSur Inmobiliaria" />
  <meta name="twitter:description" content="Compra, vende o alquila en Jerez de la Frontera con expertos locales." />
  <meta name="twitter:image"       content="/Hero.jpg" />
  <meta name="twitter:image:alt"   content="Inmuebles en Jerez de la Frontera — JerezSur Inmobiliaria" />

  <!-- ── Structured Data — LocalBusiness / RealEstateAgent ─────────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "RealEstateAgent",
    "name": "JerezSur Inmobiliaria",
    "description": "Inmobiliaria en Jerez de la Frontera especializada en compra, venta y alquiler de viviendas con atención cercana y profesional.",
    "url": "https://jerezsur.com",
    "telephone": "+34615061840",
    "email": "info@jerezsur.com",
    "logo": {
      "@type": "ImageObject",
      "url": "https://jerezsur.com/Favicon.png",
      "width": 256,
      "height": 256
    },
    "image": "https://jerezsur.com/Hero.jpg",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Jerez de la Frontera",
      "addressRegion": "Cádiz",
      "postalCode": "11400",
      "addressCountry": "ES"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": 36.6815,
      "longitude": -6.1334
    },
    "openingHoursSpecification": [
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
        "opens": "09:30",
        "closes": "14:00"
      },
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
        "opens": "17:00",
        "closes": "20:00"
      }
    ],
    "areaServed": {
      "@type": "City",
      "name": "Jerez de la Frontera"
    },
    "priceRange": "€€",
    "sameAs": []
  }
  </script>

  <!-- ── Preconexiones (avisan al navegador de qué dominios usaremos) ─ -->
  <link rel="dns-prefetch" href="https://res.cloudinary.com" />
  <link rel="dns-prefetch" href="https://images.unsplash.com" />
  <link rel="preconnect" href="https://accounts.google.com" crossorigin />
  <link rel="dns-prefetch" href="https://connect.facebook.net" />
  <link rel="dns-prefetch" href="https://graph.facebook.com" />
  <!-- Google Maps (iframe en Home y Contacto) -->
  <link rel="dns-prefetch" href="https://maps.googleapis.com" />
  <link rel="dns-prefetch" href="https://maps.gstatic.com" />

  <!-- ── Preload del LCP — imagen del hero (local, misma origen) ─────── -->
  <!-- La imagen debe coincidir con la usada en __Hero.scss para que el preload sea efectivo -->
  <link rel="preload" as="image" href="/Hero.jpg" type="image/jpeg" fetchpriority="high" />

  <!-- Font Awesome eliminado: el proyecto usa lucide-react para todos los iconos,
       por lo que la hoja de estilos de FA (107 KB) era código muerto. -->

  <!-- ── SDKs OAuth social ─────────────────────────────────────────── -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script defer src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/auth/js/appleid.auth.js"></script>
  <!-- Facebook SDK se carga dinámicamente desde SocialAuth.tsx -->
</head>

<body>
  <!-- Contenido de React -->
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
