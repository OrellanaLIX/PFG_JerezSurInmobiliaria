version: '3.8'

services:

  # ── PROXY INVERSO (Nginx + HTTPS) ─────────────────────────────────────
  # init-ssl.sh genera el certificado autofirmado la primera vez que arranca.
  # El certificado se guarda en el volumen ssl-certs y se reutiliza en siguientes reinicios.
  proxy:
    image: nginx:alpine
    container_name: proxy_nginx
    entrypoint: ["/bin/sh", "/scripts/init-ssl.sh"]
    ports:
      - "80:80"    # HTTP → redirige permanentemente a HTTPS
      - "443:443"  # HTTPS (tráfico real con SSL)
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./init-ssl.sh:/scripts/init-ssl.sh:ro
      - ssl-certs:/etc/nginx/ssl
    networks:
      - red-publica
    depends_on:
      - front-publico
      - front-admin
      - backend
      - python-stats
    restart: always

  # ── FRONTEND PÚBLICO (React + Vite) ───────────────────────────────────
  front-publico:
    build:
      context: ./JerezSur-frontend
      dockerfile: dockerfile
    container_name: react_front_publico
    networks:
      - red-publica
    restart: always

  # ── FRONTEND ADMINISTRACIÓN (React + Vite) ────────────────────────────
  front-admin:
    build:
      context: ./JerezSur-admin
      dockerfile: dockerfile
    container_name: react_front_admin
    networks:
      - red-publica
    restart: always

  # ── BACKEND (Spring Boot + Java 21) ───────────────────────────────────
  backend:
    build:
      context: ./JerezSur-Inmobiliaria
      dockerfile: dockerfile
    container_name: spring_backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://bd:3306/jerezsur_db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=jerezsur_user
      - SPRING_DATASOURCE_PASSWORD=jerezsur_pass
      - PYTHON_STATS_URL=http://python-stats:5000
    networks:
      - red-publica
      - red-datos
    depends_on:
      bd:
        condition: service_healthy
    restart: always

  # ── MICROSERVICIO DE ESTADÍSTICAS (Python Flask) ───────────────────────
  python-stats:
    build:
      context: ./Python
      dockerfile: dockerfile
    container_name: flask_python_stats
    networks:
      - red-publica
    restart: always

  # ── BASE DE DATOS (MySQL 8.0) ──────────────────────────────────────────
  bd:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      - MYSQL_ROOT_PASSWORD=root_password_seguro
      - MYSQL_DATABASE=jerezsur_db
      - MYSQL_USER=jerezsur_user
      - MYSQL_PASSWORD=jerezsur_pass
    volumes:
      - data-bd:/var/lib/mysql
    networks:
      - red-datos
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_seguro"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

networks:
  red-publica:
    driver: bridge
  red-datos:
    driver: bridge

volumes:
  data-bd:
  ssl-certs:
