version: '3.8'

services:
  # ----------------------------------------------------
  # CAPA DE ENTRADA (EL PROXY INVERSO)
  # ----------------------------------------------------
  proxy:
    image: nginx:alpine
    container_name: proxy_nginx
    ports:
      - "80:80"   # Exponemos el puerto HTTP estándar al mundo exterior
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro # Mapeamos tu configuración como Solo Lectura
    networks:
      - red-publica
    depends_on:
      - front-publico
      - front-admin
      - backend
      - python-stats
    restart: always

  # ----------------------------------------------------
  # CAPA DE FRONTENDS (REACT)
  # ----------------------------------------------------
  front-publico:
    build:
      context: ./front-publico
      dockerfile: Dockerfile
    container_name: react_front_publico
    networks:
      - red-publica
    restart: always

  front-admin:
    build:
      context: ./front-admin
      dockerfile: Dockerfile
    container_name: react_front_admin
    networks:
      - red-publica
    restart: always

  # ----------------------------------------------------
  # CAPA LÓGICA / NEGOCIO (SPRING BOOT)
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spring_backend
    environment:
      # Spring Boot buscará la BD usando el nombre del servicio de abajo ("bd")
      - SPRING_DATASOURCE_URL=jdbc:postgresql://bd:5432/mi_base_datos
      - SPRING_DATASOURCE_USERNAME=usuario_seguro
      - SPRING_DATASOURCE_PASSWORD=un_password_muy_seguro_y_largo
    networks:
      - red-publica # Para recibir peticiones de Nginx
      - red-datos   # Para hablar con la Base de Datos
    depends_on:
      - bd
    restart: always

  # ----------------------------------------------------
  # CAPA DE ESTADÍSTICAS (PYTHON FLASK)
  # ----------------------------------------------------
  python-stats:
    build:
      context: ./python-stats
      dockerfile: Dockerfile
    container_name: flask_python_stats
    networks:
      - red-publica # Solo necesita escuchar a Nginx (recibe los JSON por POST)
    restart: always

  # ----------------------------------------------------
  # CAPA DE DATOS (BASE DE DATOS)
  # ----------------------------------------------------
  bd:
    image: postgres:15-alpine # Ejemplo con PostgreSQL, puedes cambiarlo por MySQL/Mongo
    container_name: postgres_db
    environment:
      - POSTGRES_DB=mi_base_datos
      - POSTGRES_USER=usuario_seguro
      - POSTGRES_PASSWORD=un_password_muy_seguro_y_largo
    volumes:
      - data-bd:/var/lib/postgresql/data # Para que los datos no se borren al apagar el contenedor
    networks:
      - red-datos
    # 🔒 CRITICAL SECURITY: No hay apartado "ports". 
    # Esta base de datos es invisible para el exterior y para los frontends.
    restart: always

# ----------------------------------------------------
# DEFINICIÓN DE REDES Y VOLÚMENES
# ----------------------------------------------------
networks:
  red-publica:
    driver: bridge
  red-datos:
    driver: bridge # Red interna aislada

volumes:
  data-bd: # Espacio en el disco real para guardar la BD