# Configuración de Nginx como proxy inverso para JerezSur Inmobiliaria
#
# Nginx actúa como la "puerta de entrada" de la aplicación.
# Recibe todas las peticiones en el puerto 80 y las reenvía al servicio correcto
# según la URL que pide el cliente.
#
# Ventajas de usar Nginx como proxy:
#   - Un solo puerto expuesto al exterior (el 80)
#   - Los servicios internos no son accesibles directamente desde fuera de Docker
#   - Podemos añadir HTTPS, caché, rate limiting, etc. en un solo lugar
#   - Sirve para balancear carga si en el futuro escalamos

server {
    listen 80;
    server_name localhost;

    # ── 1. Frontend público (React + Vite) ──────────────────────────────
    # Cualquier URL que no coincida con las reglas de abajo va al frontend público
    location / {
        proxy_pass http://front-publico:5137;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── 2. API Backend (Spring Boot en puerto 8080) ──────────────────────
    # Todas las peticiones a /api/... van al backend.
    # IMPORTANTE: sin barra final en proxy_pass → Nginx conserva el prefijo /api/
    # Si pusiéramos "http://backend:8080/" quitaría el /api/ y Spring Boot no encontraría las rutas
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Ocultamos esta cabecera para no revelar qué tecnología usamos (seguridad)
        proxy_hide_header X-Powered-By;
    }

    # ── 3. Frontend de administración (React + Vite con base=/admin/) ────
    # Redirige /admin (sin barra) a /admin/ para que Vite no dé 404
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        allow all;
        # En producción restringir por IP del trabajador:
        # allow 185.23.45.112;
        # deny all;

        # Sin barra final: Nginx pasa el path completo (/admin/...) a Vite
        # El frontend admin tiene base='/admin/' en vite.config.ts, así que espera
        # que las peticiones lleguen con ese prefijo incluido
        proxy_pass http://front-admin:5137;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Estas cabeceras son necesarias para que funcione el WebSocket de HMR de Vite
        # (Hot Module Replacement: la recarga automática al guardar cambios)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── 4. Microservicio de estadísticas (Python Flask en puerto 5000) ───
    # Los gráficos del dashboard admin se generan aquí
    # El backend llama a http://python-stats:5000/grafico/... directamente,
    # pero también los dejamos accesibles desde el front-admin por /grafico/
    location /grafico/ {
        allow all;
        # En producción también restringir a la IP del admin

        proxy_pass http://python-stats:5000/grafico/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
