# Configuración Nginx con HTTPS + cabeceras de seguridad

# ── Redirigir HTTP → HTTPS ────────────────────────────────────────────
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

# ── Servidor HTTPS principal ──────────────────────────────────────────
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Cabeceras de seguridad ────────────────────────────────────────
    # Evita que la web se cargue dentro de un <iframe> de otro dominio (clickjacking)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Evita que el navegador intente "adivinar" el tipo MIME de los archivos
    add_header X-Content-Type-Options "nosniff" always;

    # Política de referrer: solo envía el origen (no la URL completa) en peticiones cross-origin
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Desactiva acceso a cámara, micrófono y geolocalización salvo permiso explícito
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;

    # HSTS: el navegador solo usará HTTPS durante 1 año (63072000 segundos)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # XSS Protection (para navegadores más antiguos)
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Caché de assets estáticos ─────────────────────────────────────
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|webp|gif|ico)$ {
        proxy_pass http://front-publico:5137;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        expires 1y;
    }

    # ── 1. Frontend público ───────────────────────────────────────────
    location / {
        proxy_pass http://front-publico:5137;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── 2. API Backend ────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    # ── 3. Frontend administración ────────────────────────────────────
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        allow all;
        proxy_pass http://front-admin:5137;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── 4. Microservicio estadísticas ─────────────────────────────────
    location /grafico/ {
        allow all;
        proxy_pass http://python-stats:5000/grafico/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
