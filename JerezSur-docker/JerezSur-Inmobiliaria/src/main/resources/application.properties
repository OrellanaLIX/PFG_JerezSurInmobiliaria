spring.config.import=optional:file:.env[.properties]

# --- CONFIGURACIÓN DE LA BASE DE DATOS ---
# En Docker, estas variables son inyectadas por docker-compose.
# En local, se usan los valores por defecto (localhost).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/jerezsur_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:toor}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- CONFIGURACIÓN DE JPA / HIBERNATE ---
