spring.config.import=optional:file:.env[.properties]

# --- CONFIGURACIÓN DE LA BASE DE DATOS ---
# En Docker, estas variables son inyectadas por docker-compose.
# En local, se usan los valores por defecto (localhost).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/jerezsur_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:toor}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- CONFIGURACIÓN DE JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- GOOGLE OAUTH2 ---
# Solo el client-id es necesario para verificar los tokens de Google en AuthService.
# client-secret y scope SOLO se usarían si activáramos el flujo Spring OAuth2 Login,
# que no usamos (nuestra verificación es manual con GoogleIdTokenVerifier).
spring.security.oauth2.client.registration.google.client-id=453262356994-ppst0cutlu3lpc0c1pvojqrjbegorngn.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=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
spring.security.oauth2.client.registration.google.scope=email,profile

# --- FACEBOOK Y APPLE (propiedades propias, NO Spring Security OAuth2) ---
# Estas propiedades NO usan el prefijo spring.security.oauth2 a propósito:
# Apple no es un proveedor estándar de Spring Security y falla al arrancar si
# se declara con client-id vacío. Facebook con credenciales válidas sí funcionaría,
# pero para mantener consistencia y evitar que Spring Security intente gestionar
# estos flujos (los gestionamos manualmente), usamos propiedades propias.
oauth2.facebook.client-id=1516350340067414
oauth2.facebook.client-secret=2de8155a9a70e260453e0e54a6cd6293

# Apple: el client-id y el private-key se configuran cuando tengas la cuenta Developer
